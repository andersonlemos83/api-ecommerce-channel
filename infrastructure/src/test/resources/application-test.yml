cucumber:
  publish:
    quiet: true

spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  rabbitmq:
    host: localhost
    port: 5672
    username: ecommerce-channel
    password: ecommerce-channel
    virtual-host: ecommerce-checkout
  data:
    redis:
      host: localhost
      port: 6379
      password: null
    mongodb:
      database: ecommerce_db
      uri: mongodb://admin:secret@localhost:27017/ecommerce_db?authSource=admin
      repositories:
        enabled: true
  mail:
    host: localhost
    port: 3025
  web:
    locale: pt_BR
    locale-resolver: fixed
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 15000
            readTimeout: 15000
            loggerLevel: FULL # NONE, BASIC, HEADERS, FULL

server:
  port: 8383

management:
  server:
    port: 9393

email:
  from: no-reply-test@gmail.com

client:
  via-cep:
    url: http://localhost:9090/
  ecommerce-checkout:
    url: http://localhost:9090/