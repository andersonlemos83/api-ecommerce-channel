management:
  server:
    port: 9393

feign:
  client:
    config:
      default:
        connectTimeout: 15000
        readTimeout: 15000
        loggerLevel: FULL # NONE, BASIC, HEADERS, FULL

client:
  via-cep:
    url: https://viacep.com.br/